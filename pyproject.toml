[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dhakagraph"
version = "0.1.0"
description = "A practical graph-based exploration of roads, places, transport, and resilience in Dhaka."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "city2graph>=1.0.0,<2.0.0",
    "folium>=0.19,<1.0",
    "geopandas>=1.0,<2.0",
    "matplotlib>=3.10,<4.0",
    "networkx>=3.4,<4.0",
    "numpy>=2.0,<3.0",
    "osmnx>=2.0.3,<3.0.0",
    "overturemaps>=1.0,<2.0",
    "pandas>=2.2,<4.0",
    "scikit-learn>=1.6,<2.0",
    "shapely>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
dhakagraph-pilot = "dhakagraph.pipeline:main"
dhakagraph-overture = "dhakagraph.overture_pipeline:main"
dhakagraph-urban = "dhakagraph.urban_pipeline:main"
dhakagraph-flood = "dhakagraph.flood_pipeline:main"
dhakagraph-equity = "dhakagraph.equity_pipeline:main"
dhakagraph-mobility = "dhakagraph.mobility_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dhakagraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

